<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Widgets Inc.</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background: #eef2f5; text-align: center; }
        .product { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .price { font-size: 24px; color: #666; margin: 20px 0; }
        button { background: #6366f1; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="product">
        <h1>Awesome Widget</h1>
        <p>This is a completely different website trying to use your new Payment Gateway.</p>
        <div class="price">$45.00</div>
        
        <!-- The button the user clicks -->
        <button id="buy-btn">Buy with NexusPay</button>
    </div>

    <script>
        // Check if the payment gateway just threw us back here after a successful payment
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status') === 'success') {
            document.body.innerHTML = `
                <div class="product-card" style="text-align: center; margin-top: 100px;">
                    <h2 style="color: #2e7d32;">Payment Successful!</h2>
                    <p>Thank you for your purchase from Awesome Widgets Inc.</p>
                    <p>The Gateway has successfully thrown you back to the merchant's website.</p>
                </div>
            `;
        }

        document.getElementById('buy-btn').addEventListener('click', async () => {
            const btn = document.getElementById('buy-btn');
            btn.textContent = 'Redirecting to Gateway...';
            btn.disabled = true;

            // ========================================================
            // EXACT CODE COPIED DIRECTLY FROM OUR docs.html QUICKSTART
            // ========================================================
            try {
                // Hardcode the absolute live Vercel URL so this file works from anywhere (even a desktop file://)
                const gatewayUrl = 'https://nexuspay-gateway-post.vercel.app';
                const merchantUrl = window.location.href.split('?')[0]; // The URL of THIS merchant page
                
                const response = await fetch(`${gatewayUrl}/api/checkout/sessions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        line_items: [{ 
                            price_data: { unit_amount: 4500 } // $45.00
                        }],
                        // Redirect back to THIS merchant's website upon success/cancel (Just like Stripe!)
                        success_url: `${merchantUrl}?status=success`,
                        cancel_url: `${merchantUrl}?status=cancelled`
                    })
                });

                const session = await response.json();
                
                // Redirect customer to NexusPay Hosted Checkout
                if (session.url) {
                    window.location.href = session.url;
                } else {
                    alert("Gateway Error: " + session.error);
                    btn.innerText = "Buy with NexusPay";
                }
            } catch (err) {
                alert("Failed to connect to the Gateway.");
                btn.innerText = "Buy with NexusPay";
            }
            // ========================================================
        });
    </script>
</body>
</html>
