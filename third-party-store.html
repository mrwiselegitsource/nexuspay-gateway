<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Widgets Inc.</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; background: #eef2f5; text-align: center; }
        .product { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .price { font-size: 24px; color: #666; margin: 20px 0; }
        button { background: #6366f1; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="product">
        <h1>Awesome Widget</h1>
        <p>This is a completely different website trying to use your new Payment Gateway.</p>
        <div class="price">$45.00</div>
        
        <!-- The button the user clicks -->
        <button id="buy-btn">Buy with NexusPay</button>
    </div>

    <script>
        document.getElementById('buy-btn').addEventListener('click', async () => {
            const btn = document.getElementById('buy-btn');
            btn.innerText = "Connecting to Gateway...";
            btn.style.opacity = '0.7';
            
            // ========================================================
            // EXACT CODE COPIED DIRECTLY FROM OUR docs.html QUICKSTART
            // ========================================================
            try {
                const baseUrl = window.location.origin;
                const response = await fetch('/api/checkout/sessions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        line_items: [{ 
                            price_data: { unit_amount: 4500 } // $45.00
                        }],
                        success_url: `${baseUrl}/success.html`,
                        cancel_url: `${baseUrl}/cancel.html`
                    })
                });

                const session = await response.json();
                
                // Redirect customer to NexusPay Hosted Checkout
                if (session.url) {
                    window.location.href = session.url;
                } else {
                    alert("Gateway Error: " + session.error);
                    btn.innerText = "Buy with NexusPay";
                }
            } catch (err) {
                alert("Failed to connect to the Gateway.");
                btn.innerText = "Buy with NexusPay";
            }
            // ========================================================
        });
    </script>
</body>
</html>
