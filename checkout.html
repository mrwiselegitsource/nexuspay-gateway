<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-header">
            <div class="merchant-info">
                <div class="merchant-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                <div>
                    <h1>Complete Payment</h1>
                    <p>Total amount: <strong>$99.00</strong></p>
                </div>
            </div>
        </div>

        <div class="separator"></div>

        <form id="payment-form" class="payment-form">
            <div class="form-group">
                <label for="card-name">Name on Card</label>
                <input type="text" id="card-name" placeholder="John Doe" required autocomplete="cc-name">
            </div>
            
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <div class="input-with-icon">
                    <input type="text" id="card-number" placeholder="0000 0000 0000 0000" maxlength="19" required autocomplete="cc-number">
                    <div class="card-icons">
                        <svg class="card-brand" viewBox="0 0 38 12" width="36" height="12" xmlns="http://www.w3.org/2000/svg"><path fill="#1434CB" d="M14.072 0l-1.378 8.65h-2.22l1.378-8.65h2.22zm8.566 0c-.543 0-1.424.153-2.235.534l-.4-.2-.84.288c-.687.272-1.282.686-1.748 1.157-.482.493-.84 1.107-1.045 1.77-.184.622-.224 1.298-.125 1.956.126.757.514 1.455 1.096 1.942.593.486 1.343.743 2.13.73h.08c.677 0 1.637-.168 2.378-.544l.394.2.822-.29c.636-.263 1.196-.653 1.642-1.11.458-.48.802-1.07.994-1.724.167-.588.204-1.218.114-1.838-.135-.783-.55-1.493-1.17-1.996-.583-.46-1.3-.7-2.046-.685h-.04zm-1.895 2.502c.074.004.145.02.213.045.244.09.43.267.525.503.078.208.106.434.08.66-.027.245-.13.473-.292.65-.17.182-.39.31-.634.37-.215.053-.443.05-.656-.013-.234-.078-.42-.236-.525-.453-.086-.192-.124-.4-.112-.607.018-.258.128-.5.308-.675.18-.175.412-.292.658-.335.14-.025.286-.025.435.002v-.002zm1.614 3.738c-.352.12-.724.18-1.1.18-.616.012-1.218-.184-1.71-.555-.42-.325-.694-.787-.78-1.32-.072-.47.004-1.002.267-1.428h-1.92l-.936 5.37h2.1l.245-1.427h1.61c.42.002.828-.088 1.206-.26l.084-.33.19-.074.746-.156zm-12.78-6.24h-2.12l-2.02 5.86c-.05.15-.125.286-.22.404-.085.106-.188.196-.304.265-.174.1-.37.165-.572.19-.48.055-.968.04-1.444-.04h-.233l-.062.383 1.266.304c1.107.276 2.25.41 3.4.4h.615c.342 0 .666-.11.93-.32.18-.15.316-.35.395-.572l1.9-6.87h-2.22l-.1.493-1.2 4.417c.2-.204.385-.424.552-.66L9.577 0zm14.184.004l-1.8 8.65h2.12l1.79-8.65h-2.11zm5.282.2c-.378-.175-.797-.267-1.222-.267-1.332 0-2.348.643-2.368 1.56-.02.484.444.75 1.053 1.055.674.34 1.144.57 1.137 1.018-.01.69-1.018 1.01-1.96 1.01-.65-.017-1.29-.168-1.875-.44l-.24-.12-.338 2.083c.66.315 1.378.475 2.106.47 1.408 0 2.45-.694 2.46-1.63.023-.52-.37-.78-1.077-1.127-.604-.3-1.222-.56-1.207-1.026.008-.432.613-.884 1.834-.884.51.002 1.015.1 1.488.29l.215.1.343-2.09z"/></svg>
                        <svg class="card-brand" viewBox="0 0 24 16" width="24" height="16" xmlns="http://www.w3.org/2000/svg"><path fill="#EB001B" d="M15.245 8c0-2.483-1.196-4.697-3.056-6.103a7.487 7.487 0 0 0-3.324-2.88 7.551 7.551 0 0 0-6.732.62A7.513 7.513 0 0 0 .546 5.869a7.508 7.508 0 0 0 1.587 6.643 7.514 7.514 0 0 0 3.842 2.68c2.257.6 4.673.292 6.685-.853 1.86-1.406 3.056-3.62 3.056-6.103z"/><path fill="#F79E1B" d="M23.454 8a7.545 7.545 0 0 1-2.906 5.952 7.513 7.513 0 0 1-6.685.854 7.514 7.514 0 0 1-3.842-2.681 7.51 7.51 0 0 1 2.18-9.155A7.515 7.515 0 0 1 18.934.29a7.551 7.551 0 0 1 4.52 7.71z"/><path fill="#FF5F00" d="M12.19 1.897c-1.86 1.406-3.057 3.62-3.057 6.103 0 2.482 1.197 4.696 3.056 6.102 1.86-1.405 3.057-3.62 3.057-6.102 0-2.483-1.196-4.697-3.056-6.103z"/></svg>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="card-expiry">Expiration</label>
                    <input type="text" id="card-expiry" placeholder="MM / YY" maxlength="7" required autocomplete="cc-exp">
                </div>
                <div class="form-group half-width">
                    <label for="card-cvc">Security Code (CVC)</label>
                    <div class="input-with-icon">
                        <input type="text" id="card-cvc" placeholder="123" maxlength="4" required autocomplete="cc-csc">
                        <div class="card-icons">
                            <svg class="cvc-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="separator"></div>
            <h2 style="font-size: 1rem; font-weight: 600; margin-bottom: 16px; color: var(--text-primary);">Billing Address</h2>

            <div class="form-group">
                <label for="address">Street Address</label>
                <input type="text" id="address" placeholder="123 Main St" required autocomplete="street-address">
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="New York" required autocomplete="address-level2">
                </div>
                <div class="form-group half-width">
                    <label for="state">State / Province</label>
                    <input type="text" id="state" placeholder="NY" required autocomplete="address-level1">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="zip">ZIP / Postal Code</label>
                    <input type="text" id="zip" placeholder="10001" required autocomplete="postal-code">
                </div>
                <div class="form-group half-width">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="United States" required autocomplete="country-name">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="pay-button">
                <span class="btn-text">Pay $99.00</span>
                <span class="loader" style="display: none;"></span>
            </button>

            <div class="secure-badge">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Payments are secure and encrypted
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
